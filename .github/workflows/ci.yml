name: reCognizer CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  Linting:
    if: >-
      ${{ github.actor == github.repository_owner &&
          github.triggering_actor == github.repository_owner &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-test.txt

      - name: (Linting) Ruff
        run: ruff check .

      - name: (Formatting) Ruff
        run: ruff format .

      - name: (Type-Checking) MyPy
        run: mypy .

  Build:
    if: >-
      ${{ github.actor == github.repository_owner &&
          github.triggering_actor == github.repository_owner &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12']

    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -r requirements-test.txt
        pip install -e .
        python -c "import os; os.environ['TOKENIZERS_PARALLELISM'] = 'false'"

    - name: Install Chrome Browser
      id: chrome
      uses: browser-actions/setup-chrome@v1
      with:
        chrome-version: '131.0.6778.33'

    - name: Install Playwright Chromium Driver
      run: python -m playwright install chromium

    - name: Install Patchright Chromium Driver
      run: python -m patchright install chromium

    - name: Install HuggingFace Models
      run: python .github/scripts/download-models.py

    - name: Test with PyTest
      env:
        CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
      run: pytest --reruns 5 --only-rerun TimeoutError -v --ignore tests/test_recaptcha_sites.py

  Test:
    if: >-
      ${{ github.actor == github.repository_owner &&
          github.triggering_actor == github.repository_owner &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-test.txt
          pip install -e .
          python -c "import os; os.environ['TOKENIZERS_PARALLELISM'] = 'false'"

      - name: Install Chrome Browser
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: '131.0.6778.33'

      - name: Install Playwright Chromium Driver
        run: python -m playwright install chromium

      - name: Install Patchright Chromium Driver
        run: python -m patchright install chromium

      - name: Install HuggingFace Models
        run: python .github/scripts/download-models.py

      - name: Test with PyTest
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: pytest --reruns 5 --only-rerun TimeoutError -v tests/test_recaptcha_sites.py
