name: Mac mini CI
on:
  push:
    branches:
    - '**'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: macmini-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CI: 'true'
  HUSKY: '0'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
defaults:
  run:
    shell: bash -e -o pipefail {0}
jobs:
  check:
    name: Lint, model-backed tests and Python package build
    if: >-
      ${{ github.actor == github.repository_owner &&
          github.triggering_actor == github.repository_owner &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on:
    - self-hosted
    - macOS
    - ARM64
    - macmini
    timeout-minutes: 120
    steps:
    - name: Check latest commit
      run: python3 /Users/Shared/macmini-ci/bin/check_fresh.py
      env:
        GH_TOKEN: ${{ github.token }}
    - uses: actions/checkout@v4
      if: ${{ env.MACMINI_FRESH == 'true' }}
      with:
        persist-credentials: false
        submodules: false
    - name: Offline syntax and manifest checks
      if: ${{ env.MACMINI_FRESH == 'true' }}
      run: python3 /Users/Shared/macmini-ci/bin/validate-assets.py
    - name: Validate cached Chrome Browser
      id: chrome_cache
      if: ${{ env.MACMINI_FRESH == 'true' }}
      run: |
        python3 -m unittest discover -s .github/scripts/tests -p test_resolve_chrome_cache.py -v
        python3 .github/scripts/resolve-chrome-cache.py
    - name: Install Chrome Browser
      id: chrome
      if: ${{ env.MACMINI_FRESH == 'true' && steps.chrome_cache.outputs.cache-hit != 'true' }}
      uses: browser-actions/setup-chrome@v1
      with:
        chrome-version: '131.0.6778.33'
    - name: Lint, model-backed tests and Python package build
      if: ${{ env.MACMINI_FRESH == 'true' }}
      env:
        CHROME_PATH: ${{ steps.chrome_cache.outputs.chrome-path || steps.chrome.outputs.chrome-path }}
      run: python3 /Users/Shared/macmini-ci/bin/project-ci.py
    - name: Upload Python distributions
      if: ${{ success() && env.MACMINI_FRESH == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: recognizer-python-dist-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          dist/*.whl
          dist/*.tar.gz
        retention-days: 7
        if-no-files-found: error
    - name: Collect CI outputs
      if: ${{ always() && env.MACMINI_FRESH == 'true' }}
      run: python3 /Users/Shared/macmini-ci/bin/collect-artifacts.py
    - name: Upload CI outputs
      if: ${{ always() && env.MACMINI_FRESH == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: macmini-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/ci-artifacts/
        retention-days: 7
        if-no-files-found: error
